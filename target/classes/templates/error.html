<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${title ?: 'Error'}">Error</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main id="main" class="error-page">
  <div class="card error-card">
    <p class="error-code" th:text="${status ?: 'Error'}">Error</p>
    <h1 th:text="${title ?: error ?: 'Something went wrong'}">Something went wrong</h1>
    <p class="muted" th:text="${message ?: 'Please try again.'}"></p>
    <p><a class="btn btn-primary" th:href="@{/}">Back to dashboard</a></p>
  </div>
</main>
</body>
</html>
