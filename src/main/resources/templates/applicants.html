<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Applicants')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main id="main">
  <div class="page-header"><div><p class="eyebrow">Specialist workspace</p><h1>Applicants</h1>
    <p class="muted">Companies submitting labels, with private notes for the review team.</p></div></div>
  <th:block th:replace="~{fragments/layout :: flash}"></th:block>
  <div class="card">
    <div class="empty" th:if="${#lists.isEmpty(rows)}">No applicant companies yet.</div>
    <div class="table-wrap" th:unless="${#lists.isEmpty(rows)}">
      <table>
        <thead><tr><th>Company</th><th>Contact</th><th>Labels</th><th>Specialist notes</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}">
          <td><strong th:text="${r.applicant.companyName}"></strong></td>
          <td class="small"><div th:text="${r.applicant.contactName}"></div><div class="muted" th:text="${r.applicant.contactEmail}"></div></td>
          <td class="num" th:text="${r.labelCount}"></td>
          <td>
            <form th:action="@{/applicants/{id}/notes(id=${r.applicant.id})}" method="post" class="actions">
              <input type="text" name="notes" th:value="${r.applicant.notes}" th:attr="aria-label='Notes for ' + ${r.applicant.companyName}">
              <button class="btn" type="submit">Save</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
